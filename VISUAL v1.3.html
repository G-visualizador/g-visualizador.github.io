  r.setProperty("--zoom", 1 + S.zoom / 100); r.setProperty("--bo", S.border / 100); r.setProperty("--sh", S.shadow / 100); r.setProperty("--ff", FONTS[S.font] || FONTS.sys);
  const c = document.body.classList;
  c.toggle("noanim", !S.anim); c.toggle("zoom", !!S.zoomOn); c.toggle("tsh", !!S.tsh); c.toggle("solid", !!S.solid);
  $("app").style.zoom = S.fscale / 100;
  $("grid") && ($("grid").className = "grid" + (S.view === "list" ? " list" : "") + (S.titles ? "" : " nt"));
  $("hd").textContent = S.head; $("hd").hidden = !S.head; document.title = S.head || TITLE;
  $("note").textContent = "Los vídeos que reproduces se guardan en este navegador" + (user ? " (cuenta: " + user + ")." : ".") + " Usa Ajustes > Datos para hacer una copia."; $("note").hidden = !S.showNote;
  const g = $("greet"); g.hidden = !(S.greet && user); if (user) g.textContent = "Hola, " + (users[user].display || user);
  document.querySelectorAll("[data-dep]").forEach(w => { w.hidden = w.dataset.dep !== S.bgmode });
  applyBg(); updUser();
}
function updUser() {
  const b = $("usr"); b.innerHTML = "";
  if (user) { const a = el("span", "av", (users[user].display || user)[0].toUpperCase()); a.style.background = users[user].color; b.append(a, document.createTextNode(users[user].display || user)) }
  else b.textContent = "Entrar";
}

// ---------- Enlaces y búsqueda ----------
function parseId(t) {
  t = (t || "").trim().replace(/&amp;/g, "&");
  for (let i = 0; i < 4; i++) { try { const d = decodeURIComponent(t); if (d === t) break; t = d } catch (e) { break } }
  const m = t.match(/(?:youtu\.be\/|[?&\/]v[=\/]|\/embed\/|\/shorts\/|\/live\/|\/vi?\/|\/e\/|watch\/)([\w-]{11})(?![\w-])/);
  return m ? m[1] : null;
}
const SHORT = /^(https?:\/\/)?(www\.)?(bit\.ly|goo\.gl|t\.co|tinyurl\.com|is\.gd|ow\.ly|buff\.ly|rb\.gy|cutt\.ly|lnkd\.in)\//i;
const decode = s => { try { return new DOMParser().parseFromString(s, "text/html").documentElement.textContent } catch (e) { return s } };
const all = () => VIDEOS.map(v => ({id:v.id, title:v.title})).concat(D.saved.filter(s => !VIDEOS.some(v => v.id === s.id)));
const find = id => all().filter(v => v.id === id)[0];
function fetchTitle(id, cb) {
  try { fetch("https://www.youtube.com/oembed?format=json&url=" + encodeURIComponent("https://www.youtube.com/watch?v=" + id)).then(r => r.json()).then(j => { if (j && j.title) cb(j.title) }).catch(() => {}) } catch (e) {}
}
const cget = q => { const a = LS.get("vp_cache", {}), e = a[q]; return e && Date.now() - e.t < 432e5 ? e.items : null };
const cset = (q, items) => { const a = LS.get("vp_cache", {}); a[q] = {t:Date.now(), items}; const k = Object.keys(a); if (k.length > 30) delete a[k[0]]; LS.set("vp_cache", a) };
function showRes(t, node) { $("resT").textContent = t; const b = $("res"); b.innerHTML = ""; b.appendChild(node); $("resBox").hidden = false }
const msg = t => el("div", "msg glass", t);
function renderRes(q, items) {
  if (!items.length) { showRes("Resultados de «" + q + "»", msg("No he encontrado vídeos. Prueba con otras palabras.")); return }
  const w = el("div", "stack"); w.style.margin = "0";
  items.forEach(it => {
    const b = el("button", "row glass z");
    b.innerHTML = '<div class="rthumb"><img alt="" src="https://img.youtube.com/vi/' + it.id + '/mqdefault.jpg"></div><div><div class="rtitle"></div><div class="rchan"></div></div>';
    b.querySelector(".rtitle").textContent = it.title; b.querySelector(".rchan").textContent = it.channel;
    b.onclick = () => playSave(it.id, it.title); w.appendChild(b);
  });
  showRes("Resultados de «" + q + "»", w);
}
function search(q) {
  const key = S.key || API_KEY;
  if (!key) { showRes("Búsqueda por nombre no activada", msg("Para buscar por nombre hace falta una clave de la API de YouTube (Ajustes > Búsqueda). Mientras tanto, pega el enlace del vídeo.")); return }
  if (S.keepSearches) { D.searches = [q].concat(D.searches.filter(x => x !== q)).slice(0, 8); save(); renderSearches() }
  const k = [q.toLowerCase(), S.safe, S.count, S.region, S.sorder].join("|"), c = cget(k);
  if (c) { renderRes(q, c); return }
  showRes("Buscando…", msg("Buscando «" + q + "»…"));
  fetch("https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&safeSearch=" + S.safe + "&maxResults=" + S.count + "&order=" + S.sorder + "&regionCode=" + S.region + "&relevanceLanguage=" + S.hl + "&q=" + encodeURIComponent(q) + "&key=" + encodeURIComponent(key))
    .then(r => r.json()).then(j => {
      if (j.error) { const w = j.error.errors && j.error.errors[0] && j.error.errors[0].reason; showRes("No se pudo buscar", msg(w === "quotaExceeded" ? "Hoy se han agotado las búsquedas. Pega un enlace o prueba mañana." : "No se pudo buscar ahora mismo. Revisa la clave o inténtalo más tarde.")); return }
      const it = (j.items || []).filter(i => i.id && i.id.videoId).map(i => ({id:i.id.videoId, title:decode(i.snippet.title), channel:decode(i.snippet.channelTitle)}));
      cset(k, it); renderRes(q, it);
    }).catch(() => showRes("Sin conexión", msg("No se pudo conectar para buscar.")));
}
function renderSearches() {
  const s = $("srch"); s.innerHTML = "";
  if (!S.keepSearches || !D.searches.length) return;
  D.searches.forEach(t => { const b = el("button", "ch glass z", t); b.onclick = () => { $("q").value = t; go() }; s.appendChild(b) });
  s.appendChild(btn("Borrar", () => { D.searches = []; save(); renderSearches() }));
}
function go() {
  const t = $("q").value.trim(); if (!t) { $("q").focus(); return }
  $("q").style.borderColor = ""; const id = parseId(t);
  if (id) { $("q").value = ""; $("resBox").hidden = true; playSave(id); return }
  if (SHORT.test(t)) { $("q").style.borderColor = "#ff8a80"; toast("Los enlaces acortados no se pueden leer desde aquí: ábrelo y copia la dirección final"); return }
  if (/^(https?:\/\/|www\.)/i.test(t)) { $("q").style.borderColor = "#ff8a80"; toast("Ese enlace no parece de YouTube"); return }
  search(t);
}

// ---------- Listas de vídeos ----------
function list() {
  let a = all();
  if (curList) a = (D.lists[curList] || []).map(id => find(id) || {id, title:"Vídeo " + id});
  else {
    if (tab === "fav") a = a.filter(v => D.favs[v.id]);
    if (S.order === "old") a = a.slice(0, VIDEOS.length).concat(a.slice(VIDEOS.length).reverse());
    if (S.order === "az") a.sort((x, y) => x.title.localeCompare(y.title, "es"));
    if (S.order === "za") a.sort((x, y) => y.title.localeCompare(x.title, "es"));
    if (S.order === "fav") a = a.filter(v => D.favs[v.id]).concat(a.filter(v => !D.favs[v.id]));
  }
  const f = fltVal.trim().toLowerCase(); if (f) a = a.filter(v => v.title.toLowerCase().includes(f));
  return a;
}
function card(v) {
  const c = el("div", "card glass z"), b = el("button", "play"), fixed = VIDEOS.some(x => x.id === v.id);
  b.innerHTML = '<div class="thumb"><img alt="" src="https://img.youtube.com/vi/' + v.id + '/hqdefault.jpg"></div><span class="name"></span>';
  b.querySelector(".name").textContent = v.title; b.onclick = () => openV(v.id, v.title);
  const s = el("button", "mini m1 glass z", D.favs[v.id] ? "\u2605" : "\u2606"); s.setAttribute("aria-label", "Favorito");
  s.onclick = e => { e.stopPropagation(); toggleFav(v.id); render() };
  const p = el("button", "mini m2 glass z", "+"); p.setAttribute("aria-label", "Añadir a una lista");
  p.onclick = e => { e.stopPropagation(); listMenu(p, v.id, v.title) };
  c.append(b, s, p);
  if (!fixed) {
    const d = el("button", "mini m3 glass z", "\u2715"); d.setAttribute("aria-label", "Quitar");
    d.onclick = async e => { e.stopPropagation(); if (await confirmDel("¿Quitar «" + v.title + "» de tus vídeos?")) { D.saved = D.saved.filter(x => x.id !== v.id); delete D.favs[v.id]; save(); render() } };
    c.appendChild(d);
  }
  return c;
}
function toggleFav(id) { D.favs[id] ? delete D.favs[id] : D.favs[id] = 1; save(); updFav() }
function toggleList(n, id, title) {
  if (!find(id)) D.saved.unshift({id, title:title || "Vídeo " + id});
  const a = D.lists[n] = D.lists[n] || [], i = a.indexOf(id);
  i < 0 ? a.push(id) : a.splice(i, 1);
  save(); toast(i < 0 ? "Añadido a «" + n + "»" : "Quitado de «" + n + "»"); render();
}
function listMenu(anchor, id, title) {
  const items = Object.keys(D.lists).map(n => [n, () => toggleList(n, id, title), (D.lists[n] || []).includes(id)]);
  items.push(["\uFF0B Nueva lista…", async () => { const n = await askText("Nueva lista", "", "Nombre de la lista"); if (n) { D.lists[n] = D.lists[n] || []; toggleList(n, id, title) } }]);
  popMenu(anchor, items);
}

// ---------- Pantallas principales ----------
function renderTabs() {
  const t = $("tabs"); t.innerHTML = "";
  [["inicio", "Inicio"], ["fav", "Favoritos"], ["listas", "Listas"], ["hist", "Historial"]].forEach(([k, n]) => {
    const b = el("button", "ch glass z" + (tab === k ? " on" : ""), n);
    b.onclick = () => { tab = k; curList = null; fltVal = ""; render() }; t.appendChild(b);
  });
}
function render() {
  renderTabs(); const m = $("main"); m.innerHTML = "";
  if (tab === "listas" && !curList) renderLists(m); else if (tab === "hist") renderHist(m); else renderVideos(m);
  apply();
}
function renderVideos(m) {
  const sec = el("div", "sec"), h = el("h2", "", curList ? "Lista: " + curList : tab === "fav" ? "Favoritos" : "Mis vídeos"), cnt = el("small", "", "");
  h.appendChild(cnt); sec.appendChild(h);
  if (curList) sec.append(btn("\u2190 Volver", () => { curList = null; render() }), btn("Reproducir lista", () => { if (shown.length) openV(shown[0].id, shown[0].title) }, 1));
  const f = el("input", "in"); f.placeholder = "Filtrar vídeos"; f.value = fltVal; f.hidden = !S.showFlt; f.oninput = () => { fltVal = f.value; fill() };
  const r = btn("Aleatorio", () => { if (shown.length) { const v = shown[Math.floor(Math.random() * shown.length)]; openV(v.id, v.title) } }); r.hidden = !S.showRnd;
  sec.append(f, r); m.appendChild(sec);
  const g = el("div", "grid"); g.id = "grid"; m.appendChild(g);
  function fill() {
    shown = list(); g.innerHTML = ""; cnt.textContent = " (" + shown.length + ")";
    if (!shown.length) g.appendChild(msg(tab === "fav" ? "Todavía no tienes favoritos. Pulsa la estrella de un vídeo." : "No hay vídeos que coincidan."));
    shown.forEach(v => g.appendChild(card(v)));
  }
  fill();
}
function renderLists(m) {
  const sec = el("div", "sec"); sec.appendChild(el("h2", "", "Mis listas"));
  sec.appendChild(btn("\uFF0B Nueva lista", async () => { const n = await askText("Nueva lista", "", "Nombre de la lista"); if (n && !D.lists[n]) { D.lists[n] = []; save(); render() } }, 1));
  m.appendChild(sec);
  const names = Object.keys(D.lists);
  if (!names.length) { m.appendChild(msg("Aún no tienes listas. Crea una y añade vídeos con el botón + de cada vídeo.")); return }
  const g = el("div", "grid");
  names.forEach(n => {
    const c = el("div", "lc glass z"), ids = D.lists[n], first = ids[0];
    if (first) { const t = el("div", "thumb"); t.innerHTML = '<img alt="" src="https://img.youtube.com/vi/' + first + '/mqdefault.jpg">'; c.appendChild(t) }
    c.append(el("h3", "", n), el("span", "rchan", ids.length + " vídeos"));
    const b = el("div", "btns");
    b.append(
      btn("Abrir", () => { curList = n; fltVal = ""; render() }, 1),
      btn("Renombrar", async () => { const x = await askText("Renombrar lista", n); if (x && x !== n && !D.lists[x]) { D.lists[x] = D.lists[n]; delete D.lists[n]; save(); render() } }),
      btn("Borrar", async () => { if (await confirmDel("¿Borrar la lista «" + n + "»?")) { delete D.lists[n]; save(); render() } })
    );
    c.appendChild(b); g.appendChild(c);
  });
  m.appendChild(g);
}
function renderHist(m) {
  const sec = el("div", "sec"); sec.appendChild(el("h2", "", "Historial"));
  sec.appendChild(btn("Borrar historial", async () => { if (await confirmDel("¿Borrar el historial?")) { D.hist = []; save(); render() } }));
  m.appendChild(sec);
  if (!S.hist) { m.appendChild(msg("El historial está desactivado en Ajustes > Mis vídeos.")); return }
  if (!D.hist.length) { m.appendChild(msg("Todavía no has visto ningún vídeo.")); return }
  const st = el("div", "stack");
  D.hist.forEach(h => {
    const b = el("button", "row glass z");
    b.innerHTML = '<div class="rthumb"><img alt="" src="https://img.youtube.com/vi/' + h.id + '/mqdefault.jpg"></div><div><div class="rtitle"></div><div class="rchan"></div></div>';
    b.querySelector(".rtitle").textContent = h.title; b.querySelector(".rchan").textContent = new Date(h.t).toLocaleString("es-ES", {dateStyle:"medium", timeStyle:"short"});
    b.onclick = () => openV(h.id, h.title); st.appendChild(b);
  });
  m.appendChild(st);
}
function renderAll() { apply(); render(); renderSearches() }

// ---------- Reproductor ----------
function updFav() { $("ofav").textContent = D.favs[cur] ? "\u2605" : "\u2606" }
function record(id, title) {
  D.hist = [{id, title, t:Date.now()}].concat(D.hist.filter(h => h.id !== id)).slice(0, S.histMax); save();
}
function openV(id, title) {
  cur = id; const t = title || (find(id) || {}).title || "Vídeo " + id;
  $("ttl").textContent = t; $("stage").innerHTML = "";
  const f = el("iframe"), H = S.host === "nc" ? "https://www.youtube-nocookie.com" : "https://www.youtube.com", q = ["autoplay=" + (S.auto ? 1 : 0), "hl=" + S.hl];
  if (S.mute) q.push("mute=1"); if (S.cc) q.push("cc_load_policy=1&cc_lang_pref=" + S.hl); if (S.loop) q.push("loop=1&playlist=" + id);
  if (!S.controls) q.push("controls=0"); if (!S.kb) q.push("disablekb=1"); if (!S.fsok) q.push("fs=0");
  if (S.host !== "min") { q.push("rel=" + (S.rel ? 1 : 0), "modestbranding=1", "playsinline=1"); if (/^https?:/.test(location.origin)) q.push("origin=" + encodeURIComponent(location.origin)); f.referrerPolicy = "strict-origin-when-cross-origin" }
  f.src = H + "/embed/" + id + "?" + q.join("&"); f.title = t;
  f.allow = "autoplay; encrypted-media; picture-in-picture" + (S.fsok ? "; fullscreen" : ""); f.allowFullscreen = !!S.fsok;
  $("stage").appendChild(f); $("nbar").hidden = !S.notes; $("note2").value = D.notes[id] || "";
  $("ov").hidden = false; $("close").focus(); updFav();
  if (S.hist) record(id, t);
}
function closeV() { $("ov").hidden = true; $("stage").innerHTML = "" }
function step(d) {
  if (!shown.length) return;
  let i = shown.findIndex(v => v.id === cur); i = i < 0 ? 0 : (i + d + shown.length) % shown.length; openV(shown[i].id, shown[i].title);
}
function playSave(id, known) {
  let t = known || "Vídeo " + id; const ex = find(id); if (ex) t = ex.title;
  if (!ex && S.autosave) {
    D.saved.unshift({id, title:t}); save(); render();
    if (!known) fetchTitle(id, r => { D.saved.forEach(x => { if (x.id === id) x.title = r }); save(); render(); if (!$("ov").hidden && cur === id) $("ttl").textContent = r });
  } else if (!ex && !known) fetchTitle(id, r => { if (!$("ov").hidden && cur === id) $("ttl").textContent = r });
  openV(id, t);
}
function nextMode() {
  S.host = {yt:"nc", nc:"min", min:"yt"}[S.host] || "yt"; save(); openV(cur, $("ttl").textContent);
  toast("Probando: " + ({yt:"youtube.com", nc:"youtube-nocookie.com", min:"modo simple"}[S.host]));
}

// ---------- Eventos ----------
$("go").onclick = go;
$("q").addEventListener("keydown", e => { if (e.key === "Enter") go() });
$("resX").onclick = () => { $("resBox").hidden = true };
$("cfg").onclick = () => openSettings();
$("usr").onclick = () => user ? openSettings("acc") : openAuth("login");
$("close").onclick = closeV; $("prev").onclick = () => step(-1); $("next").onclick = () => step(1);
$("alt").onclick = nextMode; $("ofav").onclick = () => { toggleFav(cur); render() };
$("olst").onclick = () => listMenu($("olst"), cur, $("ttl").textContent);
$("copy").onclick = () => { navigator.clipboard.writeText("https://youtu.be/" + cur).then(() => toast("Enlace copiado")).catch(() => toast("No se pudo copiar")) };
$("note2").onchange = () => { const v = $("note2").value.trim(); v ? D.notes[cur] = v : delete D.notes[cur]; save(); toast("Nota guardada") };
document.addEventListener("keydown", e => {
  const ty = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName), ms = $("mroot").lastElementChild;
  if (e.key === "Escape") { closeMenus(); if (ms) ms.remove(); else if (!$("ov").hidden) closeV() }
  else if (ty || ms) return;
  else if (!$("ov").hidden) {
    const k = e.key.toLowerCase();
    if (k === "arrowright") step(1); else if (k === "arrowleft") step(-1);
    else if (k === "f") { toggleFav(cur); render() } else if (k === "l") listMenu($("olst"), cur, $("ttl").textContent); else if (k === "m") nextMode();
  }
  else if (e.key === "/") { e.preventDefault(); $("q").focus() }
  else if (e.key === "?") openSettings("keys");
  else if (e.key === ",") openSettings();
});

// ---------- Inicio ----------
loadNS(); tab = S.startTab; apply(); render(); renderSearches();
if (G.gate && !user) openAuth("login"); else if (!LS.get("vp_welcomed", false)) welcome();
})();
</script>
